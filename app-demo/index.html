:root{color-scheme:light;--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--accent:#2a78d6;--nav-h:56px}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme=light])){color-scheme:dark;--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--accent:#3987e5}}
:root[data-theme=dark]{color-scheme:dark;--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--accent:#3987e5}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--page);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
h1{font-size:1.02rem;font-weight:700;white-space:nowrap}
h1 .sub{color:var(--muted);font-weight:400;font-size:.78rem;margin-left:6px}
.tabs{display:flex;gap:4px;margin-left:6px}
.tabs button{font:inherit;font-size:.88rem;padding:7px 16px;border:none;cursor:pointer;background:transparent;color:var(--ink2);border-radius:9px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff;font-weight:700}
.sp{flex:1}
.hbtn{font:inherit;font-size:.78rem;border:1px solid var(--border);border-radius:8px;background:var(--page);color:var(--ink);padding:5px 12px;cursor:pointer}
.hbtn.locked{opacity:.55;cursor:help}
#syncBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 16px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);font-size:.76rem;color:var(--muted)}
#syncBar .ok{color:#0ca30c}#syncBar .warn{color:#d03b3b}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--page);display:none}
iframe.on{display:block}
nav{display:none;flex:none;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav .row{display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav button{font:inherit;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ic{font-size:1.25rem;line-height:1}
nav button .lb{font-size:.68rem}
nav button.on{color:var(--accent);font-weight:700}
@media (max-width:700px){.tabs{display:none}nav{display:block}h1 .sub{display:none}}
</style>
</head>

var DATA_KEYS = ['eng-quote-v1','dispatch-v1','cashbook-v1','repair-v1'].map(function(k){ return (DEMO_MODE?'demo:':'')+k; });
var mainEl = document.getElementById('main');
var views = {};
function decode(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); })); }
function showTab(key){
  APPS.forEach(function(a){ document.querySelectorAll('[data-tab="'+a.key+'"]').forEach(function(b){ b.classList.toggle('on', a.key===key); }); });
  if(!views[key]){
    var a = APPS.filter(function(x){return x.key===key;})[0];
    var f = document.createElement('iframe'); f.srcdoc = decode(a.b64); f.title = a.lb;
    views[key] = f; mainEl.appendChild(f);
  }
  Object.keys(views).forEach(function(k){ views[k].classList.toggle('on', k===key); });
  try { history.replaceState(null,'','#'+key); } catch(e){}
}
var barTop = document.getElementById('tabsTop'), barBot = document.getElementById('tabsBottom');
APPS.forEach(function(a){
  var t = document.createElement('button'); t.dataset.tab=a.key; t.textContent=a.lb;
  t.onclick=function(){ showTab(a.key); }; barTop.appendChild(t);
  var b = document.createElement('button'); b.dataset.tab=a.key;
  b.innerHTML='<span class="ic">'+a.ic+'</span><span class="lb">'+a.lb+'</span>';
  b.onclick=function(){ showTab(a.key); }; barBot.appendChild(b);
});
document.getElementById('theme').onclick=function(){
  var r=document.documentElement, cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  var next=cur==='dark'?'light':'dark'; r.dataset.theme=next;
  Object.keys(views).forEach(function(k){ try{ views[k].contentDocument.documentElement.dataset.theme=next; }catch(e){} });
};

/* ===== 資料存取層（階段二 Firebase 掛這裡） =====
   collect() 取全部四工具資料；applyData() 寫回；onLocalChange 由內嵌工具的 storage 事件觸發。 */
window.SuiteData = {
  collect: function(){ var o={version:1,savedAt:new Date().toISOString(),data:{}};
    DATA_KEYS.forEach(function(k){ var v=localStorage.getItem(k); if(v!==null) o.data[k]=v; }); return o; },
  apply: function(obj){ if(!obj||!obj.data) throw new Error('格式不對');
    DATA_KEYS.forEach(function(k){ if(obj.data[k]!==undefined) localStorage.setItem(k,obj.data[k]); }); },
  reloadTools: function(){ Object.keys(views).forEach(function(k){ try{ views[k].contentWindow.location.reload(); }catch(e){} }); },
  onChange: null   // 階段二設成 function(){ 推雲端 }
};
/* 每次自動存檔（內嵌工具寫 localStorage）都更新狀態列時間，讓使用者看得到「剛剛存過」。
   用 __cloudPushNow（登入才有）判斷是否登入雲端，而非 onChange（一直存在）。 */
window.addEventListener('storage', function(e){
  if (DATA_KEYS.indexOf(e.key) < 0) return;
  var s = document.getElementById('syncStatus');
  var t = new Date(), hh = String(t.getHours()).padStart(2,'0'), mm = String(t.getMinutes()).padStart(2,'0'), ss = String(t.getSeconds()).padStart(2,'0');
  if (typeof window.__cloudPushNow === 'function') {
    s.textContent = '☁ ' + hh+':'+mm+':'+ss + ' 存檔中…'; s.className = '';   // 稍後 pushNow 顯示「儲存成功（雲端）」
  } else {
    s.textContent = DEMO_MODE ? ('✔ ' + hh+':'+mm+':'+ss + ' 已記錄（展示版・重整即清空）') : ('✔ ' + hh+':'+mm+':'+ss + ' 已自動存檔（本機）'); s.className = 'ok';
  }
  if (typeof window.SuiteData.onChange === 'function') window.SuiteData.onChange();   // 登入時節流推雲；未登入自動 no-op
});

/* 立即存檔：資料本來就即時存在本機；若已登入雲端則強制馬上推雲（跳過 1.5 秒節流） */
window.__cloudPushNow = null;   // 雲端 IIFE 登入後設成立即推雲的函式
document.getElementById('saveNowBtn').onclick = function(){
  var s = document.getElementById('syncStatus');
  var t = new Date(), hh = String(t.getHours()).padStart(2,'0'), mm = String(t.getMinutes()).padStart(2,'0'), ss = String(t.getSeconds()).padStart(2,'0');
  if (typeof window.__cloudPushNow === 'function') {
    window.__cloudPushNow();   // pushNow 自己會把狀態更新成「時分秒 儲存成功（雲端）」
  } else {
    s.textContent = DEMO_MODE ? ('✔ ' + hh+':'+mm+':'+ss + ' 已記錄（展示版・重整即清空）') : ('✔ ' + hh+':'+mm+':'+ss + ' 儲存成功（本機，未登入雲端）'); s.className = 'ok';
  }
};

/* ===== 雲端同步（自帶 Firebase 設定；不填＝純本機。merge/隔離邏輯經 Firestore 模擬器驗證 23/23） ===== */
(function(){
  var CFG_KEY='fb-config';
  var statusEl=document.getElementById('syncStatus');
  var cloudBtn=document.getElementById('cloudBtn');
  var fb=null, db=null, auth=null, uid=null, lastAppliedAt=null, pushTimer=null, unsub=null;
  function decideMerge(local, cloud){
    var lHas=local&&local.savedAt&&local.data&&Object.keys(local.data).length>0;
    var cHas=cloud&&cloud.savedAt&&cloud.data&&Object.keys(cloud.data).length>0;
    if(!cHas&&!lHas) return 'noop';
    if(cHas&&!lHas) return 'pull';
    if(lHas&&!cHas) return 'push';
    if(cloud.savedAt>local.savedAt) return 'pull';
    if(local.savedAt>cloud.savedAt) return 'push';
    return 'noop';
  }
  function shouldApplyIncoming(inc,last){ if(!inc||!inc.savedAt) return false; if(!last) return true; return inc.savedAt>last; }
  function decideLogin(owner, u, local, cloud){
    var cloudHas=cloud&&cloud.savedAt&&cloud.data&&Object.keys(cloud.data).length>0;
    if(owner&&owner!==u) return cloudHas?'pull':'clear';   // 別帳號的本機殘留：絕不上推
    return decideMerge(local,cloud);
  }
  function clearLocal(){ DATA_KEYS.forEach(function(k){ localStorage.removeItem(k); }); }
  function setOwner(){ if(uid) localStorage.setItem('fb-owner', uid); }
  function getConfig(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }catch(e){ return null; } }
  function setStatus(t,c){ statusEl.textContent=t; statusEl.className=c||''; }
  function askConfig(){
    var raw=prompt('貼上你的 Firebase 設定（firebaseConfig 的 { ... } 內容或整段皆可）：');
    if(!raw) return;
    var cfg;
    try{
      var m=raw.match(/\{[\s\S]*\}/); if(!m) throw new Error('找不到 { } 設定物件');
      cfg=(new Function('return ('+m[0]+')'))();
      if(!cfg.apiKey||!cfg.projectId) throw new Error('缺 apiKey 或 projectId');
    }catch(e){ alert('設定格式不對：'+e.message); return; }
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); location.reload();
  }
  if(DEMO_MODE){   // 展示版：讓人看得到雲端同步這個功能，但不連任何後端
    cloudBtn.style.display=''; cloudBtn.textContent='☁ 雲端同步'; cloudBtn.classList.add('locked');
    cloudBtn.title='展示版不提供雲端同步';
    cloudBtn.onclick=function(){
      setStatus('☁ 雲端同步（手機／電腦跨裝置即時同步）為正式版功能。此展示版僅供試用，資料只留在本次瀏覽、重新整理即清空。');
      setTimeout(function(){ setStatus('🔒 展示版：資料不保存，重整即清空'); }, 6000);
    };
    setStatus('🔒 展示版：資料不保存，重整即清空');
    return;
  }
  var cfg=getConfig() || DEFAULT_FB_CONFIG;
  if(!cfg){ cloudBtn.style.display=''; cloudBtn.textContent='設定雲端同步'; cloudBtn.onclick=askConfig; return; }
  setStatus('☁ 連線中…');
  Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
  ]).then(function(mods){
    var appMod=mods[0], authMod=mods[1], fsMod=mods[2];
    var app=appMod.initializeApp(cfg); auth=authMod.getAuth(app); db=fsMod.getFirestore(app);
    fb={authMod:authMod, fsMod:fsMod}; cloudBtn.style.display='';
    if(location.search.indexOf('emu')>=0){ try{
      authMod.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});
      fsMod.connectFirestoreEmulator(db,'127.0.0.1',8080);
      window.__cloud={ get uid(){return uid;}, get status(){return statusEl.textContent;}, get owner(){return localStorage.getItem('fb-owner');},
        signOut:function(){return authMod.signOut(auth);}, signInNew:function(){return authMod.signInAnonymously(auth);} };
      authMod.signInAnonymously(auth);
    }catch(e){ setStatus('emu err:'+e.message,'warn'); } }
    authMod.onAuthStateChanged(auth, function(user){
      if(user){ uid=user.uid; onLogin(); }
      else { uid=null; window.__cloudPushNow=null; if(unsub){unsub();unsub=null;} cloudBtn.textContent='登入雲端'; cloudBtn.onclick=login; setStatus('✔ 自動存檔（本機）｜未登入雲端'); }
    });
  }).catch(function(e){
    setStatus('⚠ 雲端載入失敗（離線或設定錯）；本機照常運作','warn');
    cloudBtn.style.display=''; cloudBtn.textContent='重設雲端設定';
    cloudBtn.onclick=function(){ localStorage.removeItem(CFG_KEY); location.reload(); };
  });
  function login(){ fb.authMod.signInWithPopup(auth, new fb.authMod.GoogleAuthProvider()).catch(function(e){ setStatus('⚠ 登入失敗：'+e.message,'warn'); }); }
  function logout(){
    var clear=confirm('要同時清除這台裝置上的本機資料嗎？\n\n確定＝清除（多人共用這台裝置時選這個；資料仍在雲端，下次登入會拉回）\n取消＝保留在本機');
    fb.authMod.signOut(auth).then(function(){
      if(clear){ clearLocal(); localStorage.removeItem('fb-owner'); lastAppliedAt=null; window.SuiteData.reloadTools(); }
    });
  }
  function userDoc(){ return fb.fsMod.doc(db,'users',uid); }
  function onLogin(){
    cloudBtn.textContent='登出（'+((auth.currentUser&&auth.currentUser.email)||uid.slice(0,6))+'）'; cloudBtn.onclick=logout;
    window.__cloudPushNow=function(){ clearTimeout(pushTimer); pushNow(); };   // 「立即存檔」按鈕用
    setStatus('☁ 同步中…');
    fb.fsMod.getDoc(userDoc()).then(function(snap){
      var cloud=snap.exists()?snap.data():null;
      var owner=localStorage.getItem('fb-owner');
      var d=decideLogin(owner, uid, window.SuiteData.collect(), cloud);
      if(d==='pull'){ window.SuiteData.apply(cloud); lastAppliedAt=cloud.savedAt; setOwner(); window.SuiteData.reloadTools(); setStatus('✔ 雲端已同步（已載入雲端資料）'); }
      else if(d==='clear'){ clearLocal(); lastAppliedAt=null; setOwner(); window.SuiteData.reloadTools(); setStatus('✔ 已切換帳號（此帳號雲端尚無資料，本機已清空）'); }
      else if(d==='push'){ pushNow(); }
      else { lastAppliedAt=cloud?cloud.savedAt:null; setOwner(); setStatus('✔ 雲端已同步'); }
      unsub=fb.fsMod.onSnapshot(userDoc(), function(s){
        if(!s.exists()) return; var inc=s.data();
        if(shouldApplyIncoming(inc,lastAppliedAt)){ window.SuiteData.apply(inc); lastAppliedAt=inc.savedAt; setOwner(); window.SuiteData.reloadTools(); setStatus('✔ 已從其他裝置更新'); }
      });
    }).catch(function(e){ setStatus('⚠ 同步失敗：'+e.message,'warn'); });
  }
  function pushNow(){
    if(!uid) return; var payload=window.SuiteData.collect();
    fb.fsMod.setDoc(userDoc(),payload).then(function(){ lastAppliedAt=payload.savedAt; setOwner();
      var t=new Date(), hh=String(t.getHours()).padStart(2,'0'), mm=String(t.getMinutes()).padStart(2,'0'), ss=String(t.getSeconds()).padStart(2,'0');
      setStatus('✔ '+hh+':'+mm+':'+ss+' 儲存成功（雲端）'); })
      .catch(function(e){ setStatus('⚠ 上雲失敗：'+e.message,'warn'); });
  }
  window.SuiteData.onChange=function(){ if(!uid) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushNow,1500); };
})();

/* Service Worker（離線）＋自動更新：偵測到新版 SW 接管就自動重載，之後每次改版使用者免手動清快取 */
if ('serviceWorker' in navigator) {
  if (navigator.serviceWorker.controller) {   // 只在「已被舊 SW 控制」時掛（首次造訪不觸發多餘重載）
    var __refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (__refreshing) return; __refreshing = true; location.reload();
    });
  }
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){ try{ reg.update(); }catch(e){} }).catch(function(){});
  });
}
</script>
</body>
</html>
