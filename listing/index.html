<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品上架資料助手</title>
<style>
:root{color-scheme:light;--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;
--muted:#898781;--grid:#e1e0d9;--line:#c3c2b7;--border:rgba(11,11,11,.10);
--accent:#2a78d6;--accent-soft:#eef3fb;--good:#0ca30c;--good-bg:#e8f6e8;--crit:#d03b3b;--crit-bg:#fbeaea;--crit-text:#a32e2e;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;
--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--grid:#2c2c2a;--line:#383835;
--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1f2a3a;--good-bg:#14290f;--crit-bg:#351b1b;--crit-text:#e66767;}}
:root[data-theme=dark]{color-scheme:dark;--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;
--grid:#2c2c2a;--line:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1f2a3a;--good-bg:#14290f;--crit-bg:#351b1b;--crit-text:#e66767;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{font-size:1.3rem;font-weight:700}header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);
color:var(--ink);padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}.btn.danger{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px;margin-top:8px}
input,select,textarea{width:100%;font:inherit;font-size:.88rem;color:var(--ink);background:var(--page);
border:1px solid var(--line);border-radius:8px;padding:6px 9px}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dynrow{display:flex;gap:6px;margin-bottom:6px}
.dynrow input{flex:1}
.msg{font-size:.82rem;padding:8px 12px;border-radius:8px;margin:8px 0;display:none}
.msg.show{display:block}.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.err{background:var(--crit-bg);color:var(--crit-text)}
#out{width:100%;min-height:280px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;white-space:pre}
.saved{font-size:.84rem}
.saved .item{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--grid);cursor:pointer}
.saved .item:hover{color:var(--accent)}
.muted{color:var(--muted);font-size:.84rem}
.platsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.platsel button{border:1px solid var(--border);background:var(--surface);color:var(--ink2);
border-radius:7px;padding:4px 12px;font-size:.8rem;cursor:pointer}
.platsel button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body><div style="background:#fff3cd;color:#664d03;font-size:13px;line-height:1.5;text-align:center;padding:8px 14px;border-bottom:1px solid #f0ad4e;font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif">🧪 試用版：資料僅暫存於本次瀏覽，重新整理頁面即清空，不會保存在您的裝置上。正式交付版本可為您永久保存資料。</div>
<div class="wrap">
<header>
<h1>商品上架資料助手</h1><span class="sp"></span>
<button class="btn" id="theme">深淺色</button>
<button class="btn" id="demo">範例</button>
<button class="btn primary" id="newP">新商品</button>
</header>
<div class="card">
<h2>商品資料</h2>
<div id="msg" class="msg"></div>
<label>商品名稱</label><input id="f_name" placeholder="例：日式陶瓷馬克杯 350ml">
<div class="two">
<div><label>價格</label><input id="f_price" type="number" min="0" value="0"></div>
<div><label>庫存</label><input id="f_stock" type="number" min="0" value="0"></div>
</div>
<label>品牌／產地（選填）</label><input id="f_brand">
<label>商品賣點（一行一個）</label>
<div id="feats"></div>
<button class="btn sm" id="addFeat">＋賣點</button>
<label>規格（名稱 / 內容）</label>
<div id="specs"></div>
<button class="btn sm" id="addSpec">＋規格</button>
<label>關鍵字／標籤（逗號分隔）</label><input id="f_tags" placeholder="馬克杯,咖啡杯,陶瓷,禮物">
<label>備註（出貨、保固等）</label><textarea id="f_note" rows="2"></textarea>
<div style="margin-top:12px;display:flex;gap:8px">
<button class="btn primary" id="gen">產生上架文案 ▶</button>
<button class="btn" id="saveP">儲存商品</button>
</div>
</div>
<div class="card">
<h2>上架文案</h2>
<div class="platsel" id="platsel">
<button data-f="shopee" class="active">蝦皮風格</button>
<button data-f="plain">簡潔條列</button>
<button data-f="table">規格表格</button>
</div>
<textarea id="out" readonly placeholder="填好左邊資料，按「產生上架文案」"></textarea>
<div style="margin-top:8px;display:flex;gap:8px">
<button class="btn primary" id="copy">複製文案</button>
<span id="copyMsg" class="muted"></span>
</div>
<h2 style="margin-top:18px">已存商品</h2>
<div id="savedList" class="saved"></div>
</div>
</div>
