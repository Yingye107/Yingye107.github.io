<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>維修保固管理</title>
<style>
:root {
color-scheme: light;
--surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e;
--muted: #898781; --grid: #e1e0d9; --line: #c3c2b7; --border: rgba(11,11,11,.10);
--accent: #2a78d6; --accent-soft: #eef3fb; --good: #0ca30c; --crit: #d03b3b; --warn:#b8860b;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme=light])){
color-scheme: dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;
}}
:root[data-theme=dark]{color-scheme:dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:1.25rem;font-weight:700}
header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);
color:var(--ink);padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}
.btn.danger{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:16px 18px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px}
input,select,textarea{font:inherit;font-size:.88rem;color:var(--ink);
background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.muted{color:var(--muted);font-size:.8rem}
.badge{font-size:.74rem;border-radius:6px;padding:1px 8px;white-space:nowrap}
.badge.ok{background:#e5f6e5;color:var(--good)}
.badge.exp{background:#fbeaea;color:var(--crit)}
.badge.soon{background:#fff3d6;color:var(--warn)}
:root[data-theme=dark] .badge.ok{background:#1d2f1d}
:root[data-theme=dark] .badge.exp{background:#3a1f1f}
:root[data-theme=dark] .badge.soon{background:#33290f}
.cust{border:1px solid var(--grid);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cust .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;cursor:pointer}
.cust .head b{font-size:.95rem}
.rec{border-top:1px dashed var(--grid);margin-top:10px;padding-top:10px;font-size:.85rem}
.rec .row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.num{font-variant-numeric:tabular-nums}
.alert{border-left:4px solid var(--warn);background:var(--accent-soft);
border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:.86rem}
.alert.over{border-left-color:var(--crit)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.78rem;padding:0 6px}
</style>
</head>

</div>

</div>

</div>
