<html lang="zh-Hant">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報價單產生器</title>
<style>
:root {
color-scheme: light;
--surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e;
--muted: #898781; --grid: #e1e0d9; --line: #c3c2b7; --border: rgba(11,11,11,.10);
--accent: #2a78d6; --accent-soft: #eef3fb; --good: #0ca30c; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme=light])){
color-scheme: dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;
}}
:root[data-theme=dark]{color-scheme:dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:920px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:1.3rem;font-weight:700}
header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);
color:var(--ink);padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}
.btn.danger{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:16px 18px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px}
input,textarea,select{width:100%;font:inherit;font-size:.88rem;color:var(--ink);
background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
textarea{resize:vertical;min-height:44px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--muted);font-size:.74rem;font-weight:600;border-bottom:1px solid var(--line)}
td input{padding:4px 6px}
.num{font-variant-numeric:tabular-nums}
.items td:nth-child(2) input{min-width:120px}
.items td .qty,.items td .price{max-width:90px}
.totbox{margin-left:auto;max-width:300px;margin-top:12px;font-size:.9rem}
.totbox .row{display:flex;justify-content:space-between;padding:4px 0}
.totbox .row.grand{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;
font-size:1.15rem;font-weight:700}
.totbox .row.grand b{color:var(--accent)}
.savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
color:var(--ink2);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.hist{font-size:.82rem}
.hist .item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
border-bottom:1px solid var(--grid);cursor:pointer}
.hist .item:hover{color:var(--accent)}
.muted{color:var(--muted);font-size:.8rem}
/* 列印 */
@media print{
body{background:#fff;padding:0}
.noprint{display:none!important}
.card{border:none;box-shadow:none;padding:0;margin-bottom:10px}
#preview{display:block!important}
.wrap{max-width:none}
}
#preview{display:none}
.pv{background:#fff;color:#111;padding:32px;border:1px solid var(--border);border-radius:8px}
.pv h3{font-size:1.5rem;margin-bottom:4px}
.pv .pv-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin:16px 0}
.pv .pv-party{font-size:.85rem;line-height:1.7}
.pv table{margin-top:8px}
.pv th,.pv td{border-bottom:1px solid #ddd;color:#111}
.pv th{color:#555}
</style>
</head>
<body><div style="background:#fff3cd;color:#664d03;font-size:13px;line-height:1.5;text-align:center;padding:8px 14px;border-bottom:1px solid #f0ad4e;font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif">🧪 試用版：資料僅暫存於本次瀏覽，重新整理頁面即清空，不會保存在您的裝置上。正式交付版本可為您永久保存資料。</div>
<div class="wrap">
<header class="noprint">
<h1>報價單產生器</h1>
<span class="sp"></span>
<button class="btn" id="theme">深淺色</button>
<button class="btn" id="newBtn">新報價單</button>
<button class="btn primary" id="printBtn">預覽 / 列印 PDF</button>
</header>
<div class="card noprint">
<h2>賣方（你的資料，會自動記住）</h2>
<div class="grid">
<div><label>公司／工作室名稱</label><input id="s_name" placeholder="○○工作室"></div>
<div><label>統一編號</label><input id="s_tax" placeholder="選填"></div>
<div><label>聯絡電話</label><input id="s_phone"></div>
<div><label>Email</label><input id="s_email"></div>
<div style="grid-column:1/-1"><label>地址</label><input id="s_addr"></div>
</div>
</div>
<div class="card noprint">
<h2>客戶
<button class="btn sm" id="saveClient">＋存此客戶</button>
</h2>
<div id="clientPills" class="savebar" style="margin-bottom:10px"></div>
<div class="grid">
<div><label>客戶名稱</label><input id="c_name" placeholder="甲公司"></div>
<div><label>聯絡人</label><input id="c_contact"></div>
<div><label>電話</label><input id="c_phone"></div>
<div style="grid-column:1/-1"><label>地址</label><input id="c_addr"></div>
</div>
</div>
<div class="card noprint">
<h2>報價單資訊</h2>
<div class="grid">
<div><label>報價單號</label><input id="q_no"></div>
<div><label>日期</label><input id="q_date" type="date"></div>
<div><label>有效期限</label><input id="q_valid" type="date"></div>
<div><label>稅別</label>
<select id="q_taxmode">
<option value="ex">外加 5% 營業稅</option>
<option value="in">內含稅（總額已含）</option>
<option value="none">免稅 / 不計稅</option>
</select>
</div>
</div>
</div>
<div class="card noprint">
<h2>品項明細
<button class="btn sm" id="addRow">＋新增一列</button>
<button class="btn sm" id="pickItem">從常用品項帶入</button>
</h2>
<table class="items">
<thead><tr><th>#</th><th>品名／說明</th><th>數量</th><th>單價</th><th>小計</th><th></th></tr></thead>
<tbody id="itemBody"></tbody>
</table>
<div class="totbox">
<div class="row"><span>小計</span><span class="num" id="t_sub">0</span></div>
<div class="row" id="discRow"><span>折扣</span>
<span><input id="q_disc" class="num" type="number" value="0" style="max-width:110px;text-align:right"></span></div>
<div class="row"><span id="taxLabel">營業稅 5%</span><span class="num" id="t_tax">0</span></div>
<div class="row grand"><span>總計</span><b class="num" id="t_grand">0</b></div>
</div>
</div>
<div class="card noprint">
<h2>備註</h2>
<textarea id="q_note" placeholder="付款方式、交期、保固等條款"></textarea>
</div>
<div class="card noprint">
<h2>已存報價單</h2>
<div class="savebar" style="margin-bottom:10px">
<button class="btn sm primary" id="saveQuote">儲存目前報價單</button>
<span class="muted">試用版不保存資料，重整即清空。正式版可永久保存報價單、客戶與常用品項。</span>
</div>
<div id="histList" class="hist"></div>
</div>
<div id="preview"></div>
</div>
