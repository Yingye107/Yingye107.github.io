<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盤後週轉率儀表板</title><style>:root{color-scheme:light;--surface-1:#fcfcfb;--page:#f9f9f7;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;--grid:#e1e0d9;--baseline:#c3c2b7;--border:rgba(11,11,11,0.10);--series-listed:#2a78d6;--series-otc:#1baf7a;--tag-bg:#eef3fb;--warn-bg:#fdf3e0;--crit-bg:#fbeaea;--crit-text:#a32e2e;--warn-text:#8a5b00}@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;--surface-1:#1a1a19;--page:#0d0d0d;--text-primary:#ffffff;--text-secondary:#c3c2b7;--text-muted:#898781;--grid:#2c2c2a;--baseline:#383835;--border:rgba(255,255,255,0.10);--series-listed:#3987e5;--series-otc:#199e70;--tag-bg:#1f2a3a;--warn-bg:#33270e;--crit-bg:#351b1b;--crit-text:#e66767;--warn-text:#e0a93f}}:root[data-theme=dark]{color-scheme:dark;--surface-1:#1a1a19;--page:#0d0d0d;--text-primary:#ffffff;--text-secondary:#c3c2b7;--text-muted:#898781;--grid:#2c2c2a;--baseline:#383835;--border:rgba(255,255,255,0.10);--series-listed:#3987e5;--series-otc:#199e70;--tag-bg:#1f2a3a;--warn-bg:#33270e;--crit-bg:#351b1b;--crit-text:#e66767;--warn-text:#e0a93f}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--page);color:var(--text-primary);padding:24px;line-height:1.5}.wrap{max-width:1080px;margin:0 auto}header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:20px}h1{font-size:1.35rem;font-weight:700}.date-chip{font-size:.85rem;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:2px 12px;background:var(--surface-1)}header .spacer{flex:1}.theme-toggle{font-size:.8rem;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:4px 12px;cursor:pointer}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}.tile .label{font-size:.78rem;color:var(--text-muted)}.tile .value{font-size:1.6rem;font-weight:700;margin-top:2px}.tile .sub{font-size:.75rem;color:var(--text-secondary)}.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:20px;overflow-x:auto}.card h2{font-size:1rem;font-weight:700;margin-bottom:4px}.card .desc{font-size:.8rem;color:var(--text-muted);margin-bottom:14px}.legend{display:flex;gap:16px;font-size:.78rem;color:var(--text-secondary);margin-bottom:12px}.legend .key{display:inline-flex;align-items:center;gap:6px}.legend .swatch{width:10px;height:10px;border-radius:3px;display:inline-block}.chart{display:grid;grid-template-columns:max-content 1fr max-content;row-gap:2px;column-gap:10px;align-items:center}.chart .yname{font-size:.8rem;color:var(--text-secondary);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.chart .track{position:relative;height:18px;border-left:1px solid var(--baseline)}.chart .bar{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 4px 4px 0;min-width:2px;cursor:default;transition:opacity .12s}.chart .row-hover .bar{opacity:.82}.chart .val{font-size:.78rem;color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}.tooltip{position:fixed;z-index:10;pointer-events:none;display:none;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:10px 12px;font-size:.8rem;max-width:280px}.tooltip .t-title{font-weight:700;margin-bottom:4px}.tooltip .t-row{display:flex;justify-content:space-between;gap:16px;color:var(--text-secondary)}.tooltip .t-row b{color:var(--text-primary);font-variant-numeric:tabular-nums;font-weight:600}.tooltip .t-themes{margin-top:6px;color:var(--text-secondary)}table{border-collapse:collapse;width:100%;font-size:.84rem}td,th{padding:7px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}th{color:var(--text-muted);font-weight:600;font-size:.76rem;border-bottom:1px solid var(--baseline)}td:nth-child(-n+3),th:nth-child(-n+3){text-align:left}td.num{font-variant-numeric:tabular-nums}td.themes-cell{text-align:left;white-space:normal;min-width:180px}.tag{display:inline-block;background:var(--tag-bg);color:var(--text-secondary);border-radius:6px;padding:1px 8px;font-size:.74rem;margin:1px 2px 1px 0}.mkt{display:inline-flex;align-items:center;gap:6px}.mkt .swatch{width:8px;height:8px;border-radius:2px;display:inline-block}.flag{border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:600}.flag.attention{background:var(--warn-bg);color:var(--warn-text)}.flag.disposal{background:var(--crit-bg);color:var(--crit-text)}.lists{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media (max-width:760px){.lists{grid-template-columns:1fr}}.lists ul{list-style:none;font-size:.82rem}.lists li{padding:6px 0;border-bottom:1px solid var(--grid);color:var(--text-secondary)}.lists li b{color:var(--text-primary);font-weight:600}footer{font-size:.75rem;color:var(--text-muted);margin-top:8px}footer code{background:var(--surface-1);border:1px solid var(--border);border-radius:4px;padding:1px 6px}</style></head><body><div class="wrap"><header><h1>盤後週轉率儀表板</h1><span class="date-chip" id="snapDate"></span> <span class="spacer"></span> <button class="theme-toggle" id="themeToggle" type="button">切換深淺色</button></header><div class="tiles" id="tiles"></div><div class="card"><h2>週轉率 Top 20</h2><div class="desc">已排除 ETF／ETN／TDR、處置與不可當沖標的；懸停長條看明細</div><div class="legend"><span class="key"><span class="swatch" style="background:var(--series-listed)"></span>上市</span> <span class="key"><span class="swatch" style="background:var(--series-otc)"></span>上櫃</span></div><div class="chart" id="chart"></div></div><div class="card"><h2>入榜明細 Top 30</h2><div class="desc">題材標籤來自 Claude Code 對話分析，累積於 SQLite，零 API 成本</div><table><thead><tr><th>#</th><th>代號／名稱</th><th>市場</th><th>收盤</th><th>成交量(張)</th><th>週轉率%</th><th>狀態</th><th>題材標籤</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="card"><h2>風險名單（快照日）</h2><div class="desc">注意股與處置中標的，入榜前已依規則排除或標示</div><div class="lists"><div><h3 style="font-size:.85rem;margin-bottom:6px"><span class="flag attention">注意</span></h3><ul id="attnList"></ul></div><div><h3 style="font-size:.85rem;margin-bottom:6px"><span class="flag disposal">處置</span></h3><ul id="dispList"></ul></div></div></div><footer>這是「把您的營運數字變成一眼看懂圖表」的示範，此處以台股盤後資料為例——可換成您的銷售、庫存、來客或任何營運數據。想把自家數字做成這樣的頁面？歡迎洽談客製。</footer></div><div class="tooltip" id="tooltip"></div><script src="data.js"></script><script>!function(){const t="undefined"!=typeof DASHBOARD_DATA?DASHBOARD_DATA:null;if(!t)return void(document.getElementById("tiles").innerHTML='<div class="tile"><div class="label">找不到 data.js</div><div class="sub">示範資料載入中，若持續顯示請重新整理</div></div>');const e=new Intl.NumberFormat("zh-TW");document.getElementById("snapDate").textContent="快照日 "+t.snapshot_date,document.getElementById("themeToggle").addEventListener("click",function(){const t=document.documentElement,e=getComputedStyle(t).colorScheme.includes("dark");t.dataset.theme=e?"light":"dark"});const s=t.stats;document.getElementById("tiles").innerHTML=[["全市場快照",e.format(s.total)+" 檔",""],["通過篩選入榜",e.format(s.eligible)+" 檔","上市 "+s.listed+"・上櫃 "+s.otc],["規則排除",e.format(s.excluded)+" 檔","ETF／ETN／TDR／處置等"],["注意股",s.attention+" 檔","快照日公告"],["處置中",s.disposal+" 檔","期間涵蓋快照日"]].map(([t,e,s])=>'<div class="tile"><div class="label">'+t+'</div><div class="value">'+e+'</div><div class="sub">'+s+"</div></div>").join("");const n=new Set(t.attention.map(t=>t.code)),a=new Set(t.disposal.map(t=>t.code)),d=t.top.slice(0,20),l=Math.max(...d.map(t=>t.turnover_pct)),o=document.getElementById("chart"),i=document.getElementById("tooltip");d.forEach(t=>{const s=document.createElement("div");s.className="yname",s.textContent=t.code+" "+t.name;const n=document.createElement("div");n.className="track";const a=document.createElement("div");a.className="bar",a.style.width=t.turnover_pct/l*100+"%",a.style.background="上市"===t.market?"var(--series-listed)":"var(--series-otc)",n.appendChild(a);const d=document.createElement("div");d.className="val",d.textContent=t.turnover_pct.toFixed(2)+"%",o.append(s,n,d),[s,n].forEach(s=>{s.addEventListener("mousemove",s=>{n.parentElement&&n.classList.add("row-hover"),i.style.display="block",i.innerHTML='<div class="t-title">'+t.code+" "+t.name+"（"+t.market+'）</div><div class="t-row"><span>收盤</span><b>'+t.close+'</b></div><div class="t-row"><span>成交量</span><b>'+e.format(t.volume_lots)+' 張</b></div><div class="t-row"><span>週轉率</span><b>'+t.turnover_pct.toFixed(2)+"%</b></div>"+(t.themes?'<div class="t-themes">題材：'+t.themes+"</div>":"");const a=i.offsetWidth,d=i.offsetHeight;let l=s.clientX+14,o=s.clientY+14;l+a>innerWidth-8&&(l=s.clientX-a-14),o+d>innerHeight-8&&(o=s.clientY-d-14),i.style.left=l+"px",i.style.top=o+"px"}),s.addEventListener("mouseleave",()=>{i.style.display="none",n.classList.remove("row-hover")})})}),document.getElementById("tbody").innerHTML=t.top.map((t,s)=>{const d="上市"===t.market?"var(--series-listed)":"var(--series-otc)",l=(a.has(t.code)?'<span class="flag disposal">處置</span> ':"")+(n.has(t.code)?'<span class="flag attention">注意</span>':""),o=t.themes?t.themes.split(",").map(t=>'<span class="tag">'+t.trim()+"</span>").join(""):'<span style="color:var(--text-muted)">－</span>';return'<tr><td class="num">'+(s+1)+"</td><td><b>"+t.code+"</b>　"+t.name+'</td><td><span class="mkt"><span class="swatch" style="background:'+d+'"></span>'+t.market+'</span></td><td class="num">'+t.close+'</td><td class="num">'+e.format(t.volume_lots)+'</td><td class="num"><b>'+t.turnover_pct.toFixed(2)+"</b></td><td>"+(l||'<span style="color:var(--text-muted)">－</span>')+'</td><td class="themes-cell">'+o+"</td></tr>"}).join(""),document.getElementById("attnList").innerHTML=t.attention.length?t.attention.map(t=>"<li><b>"+t.code+"</b>（"+t.market+"）　"+t.info.slice(0,60)+(t.info.length>60?"…":"")+"</li>").join(""):"<li>快照日無注意股公告</li>",document.getElementById("dispList").innerHTML=t.disposal.length?t.disposal.map(t=>"<li><b>"+t.code+"</b>　"+t.period_start+" ～ "+t.period_end+"　"+t.reason.slice(0,40)+(t.reason.length>40?"…":"")+"</li>").join(""):"<li>無處置期間涵蓋快照日的標的</li>"}()</script></body></html>
