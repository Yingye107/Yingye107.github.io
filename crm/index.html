<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易客戶追蹤</title>
<style>
:root{color-scheme:light;--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;

--accent:#2a78d6;--accent-soft:#eef3fb;--good:#0ca30c;--good-bg:#e8f6e8;

@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;
--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--grid:#2c2c2a;--line:#383835;
--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1f2a3a;--good-bg:#14290f;
--warn-bg:#33270e;--warn-text:#e0a93f;--crit-bg:#351b1b;--crit-text:#e66767;}}
:root[data-theme=dark]{color-scheme:dark;--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;
--grid:#2c2c2a;--line:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1f2a3a;
--good-bg:#14290f;--warn-bg:#33270e;--warn-text:#e0a93f;--crit-bg:#351b1b;--crit-text:#e66767;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:1.3rem;font-weight:700}header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);

.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}.btn.danger{color:var(--crit)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.tile .label{font-size:.76rem;color:var(--muted)}
.tile .value{font-size:1.5rem;font-weight:700}
.tile.warn{border-color:var(--warn-text)}.tile.warn .value{color:var(--warn-text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px}
input,select,textarea{width:100%;font:inherit;font-size:.88rem;color:var(--ink);background:var(--page);
border:1px solid var(--line);border-radius:8px;padding:6px 9px}
textarea{resize:vertical;min-height:44px}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.msg{font-size:.82rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none}
.msg.show{display:block}.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.err{background:var(--crit-bg);color:var(--crit-text)}
.cust{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--page)}
.cust .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cust .nm{font-weight:700}
.cust .meta{font-size:.8rem;color:var(--muted)}
.cust.due{border-color:var(--warn-text)}
.cust.overdue{border-color:var(--crit)}
.st{border-radius:6px;padding:1px 9px;font-size:.74rem;font-weight:600;white-space:nowrap}
.st.lead{background:var(--accent-soft);color:var(--accent)}
.st.talking{background:var(--warn-bg);color:var(--warn-text)}
.st.won{background:var(--good-bg);color:var(--good)}
.st.hold{background:var(--grid);color:var(--muted)}
.follow{font-size:.78rem;border-radius:6px;padding:1px 8px}
.follow.due{background:var(--warn-bg);color:var(--warn-text)}
.follow.overdue{background:var(--crit-bg);color:var(--crit-text);font-weight:600}
.detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--grid);display:none}
.detail.on{display:block}
.logline{font-size:.82rem;color:var(--ink2);padding:3px 0;border-bottom:1px solid var(--grid)}
.logline .d{color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.addlog{display:flex;gap:6px;margin-top:8px}
.addlog input{flex:1}
.sp8{flex:1}
.muted{color:var(--muted);font-size:.85rem}
.pushbtn{margin-left:auto}
</style>
</head>
