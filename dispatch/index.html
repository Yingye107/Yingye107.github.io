<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派工排班表＋台數紀錄</title>
<style>
:root {
color-scheme: light;
--surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e;
--muted: #898781; --grid: #e1e0d9; --line: #c3c2b7; --border: rgba(11,11,11,.10);
--accent: #2a78d6; --accent-soft: #eef3fb; --good: #0ca30c; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme=light])){
color-scheme: dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;
}}
:root[data-theme=dark]{color-scheme:dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:960px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:1.25rem;font-weight:700}
header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);
color:var(--ink);padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}
.btn.danger{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:16px 18px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px}
input,select,textarea{font:inherit;font-size:.88rem;color:var(--ink);
background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left}
th{color:var(--muted);font-size:.72rem;font-weight:600;border-bottom:1px solid var(--line)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--muted);font-size:.8rem}
.code{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem}
.rowline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.rowline>div{min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--accent-soft);border-radius:10px;padding:10px 14px;text-align:center}
.stat b{font-size:1.3rem;display:block}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>派工排班表＋台數紀錄</h1>
<span class="sp"></span>
<button class="btn" id="theme">深淺色</button>
<button class="btn" id="exportBtn">匯出備份</button>
<button class="btn" id="importBtn">匯入備份</button>
<input type="file" id="importFile" accept=".json" style="display:none">
<button class="btn primary" id="copyDay">複製本日行程（發LINE群組）</button>
</header>
<div class="card">
<h2>員工名單（代號自動 A、B、C…）
<button class="btn sm" id="addEmp">＋新增員工</button>
</h2>
<table>
<thead><tr><th>代號</th><th>姓名</th><th>電話</th><th></th></tr></thead>
<tbody id="empBody"></tbody>
</table>
</div>
<div class="card">
<h2>選擇日期
<input type="date" id="day" style="width:auto">
<button class="btn sm" id="today">今天</button>
</h2>
</div>
<div class="card">
<h2>本日派工 <span class="muted" id="dayLabel"></span></h2>
<div class="rowline" style="margin-bottom:12px">
<div><label>員工</label><select id="j_emp" style="min-width:90px"></select></div>
<div><label>開始</label><input type="time" id="j_from" value="09:00"></div>
<div><label>結束</label><input type="time" id="j_to" value="12:00"></div>
<div style="flex:1;min-width:160px"><label>任務內容</label><input id="j_task" placeholder="例：安裝分離式冷氣×2" style="width:100%"></div>
<div style="flex:1;min-width:140px"><label>地點／客戶</label><input id="j_loc" placeholder="例：中壢王先生" style="width:100%"></div>
<div><button class="btn primary" id="addJob">加入</button></div>
</div>
<table>
<thead><tr><th>員工</th><th>時段</th><th>任務</th><th>地點／客戶</th><th></th></tr></thead>
<tbody id="jobBody"></tbody>
</table>
</div>
<div class="card">
<h2>本日台數點記（老闆每天記一下，月底自動加總）</h2>
<div class="rowline" style="margin-bottom:12px">
<div><label>員工</label><select id="u_emp" style="min-width:90px"></select></div>
<div><label>類型</label><select id="u_type"><option>安裝</option><option>維修</option><option>保養</option><option>其他</option></select></div>
<div><label>台數</label><input type="number" id="u_n" value="1" min="1" style="width:80px"></div>
<div><label>備註</label><input id="u_note" placeholder="選填" style="width:140px"></div>
<div><button class="btn primary" id="addUnit">記一筆</button></div>
</div>
<table>
<thead><tr><th>員工</th><th>類型</th><th class="num">台數</th><th>備註</th><th></th></tr></thead>
<tbody id="unitBody"></tbody>
</table>
</div>
<div class="card">
<h2>本月統計 <span class="muted" id="monLabel"></span></h2>
<div class="statgrid" id="monStats"></div>
<table style="margin-top:12px">
<thead><tr><th>員工</th><th class="num">安裝</th><th class="num">維修</th><th class="num">保養</th><th class="num">其他</th><th class="num">合計台數</th><th class="num">派工次數</th></tr></thead>
<tbody id="monBody"></tbody>
</table>
</div>
<p class="muted">資料只存在這台電腦的瀏覽器（localStorage），不會上傳。清瀏覽器資料前請先手動備份。</p>
</div>

</body>
</html>
