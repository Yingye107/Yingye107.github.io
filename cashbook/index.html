<html lang="zh-Hant">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收支流水帳（每日損益）</title>
<style>
:root {
color-scheme: light;
--surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e;
--muted: #898781; --grid: #e1e0d9; --line: #c3c2b7; --border: rgba(11,11,11,.10);
--accent: #2a78d6; --accent-soft: #eef3fb; --good: #0ca30c; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme=light])){
color-scheme: dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;
}}
:root[data-theme=dark]{color-scheme:dark; --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
--muted:#898781; --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
--accent:#3987e5; --accent-soft:#1f2a3a;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:1.25rem;font-weight:700}
header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);
color:var(--ink);padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}
.btn.danger{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:16px 18px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px}
input,select{font:inherit;font-size:.88rem;color:var(--ink);
background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left}
th{color:var(--muted);font-size:.72rem;font-weight:600;border-bottom:1px solid var(--line)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted);font-size:.8rem}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--accent-soft);border-radius:10px;padding:12px 14px;text-align:center}
.stat b{font-size:1.35rem;display:block;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--crit)}
.rowline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.tag{font-size:.74rem;border-radius:6px;padding:1px 8px}
.tag.in{background:#e5f6e5;color:var(--good)} .tag.out{background:#fbeaea;color:var(--crit)}
:root[data-theme=dark] .tag.in{background:#1d2f1d}
:root[data-theme=dark] .tag.out{background:#3a1f1f}
</style>
</head>
<body><div style="background:#fff3cd;color:#664d03;font-size:13px;line-height:1.5;text-align:center;padding:8px 14px;border-bottom:1px solid #f0ad4e;font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif">🧪 試用版：資料僅暫存於本次瀏覽，重新整理頁面即清空，不會保存在您的裝置上。正式交付版本可為您永久保存資料。</div>
<div class="wrap">
<header>
<h1>收支流水帳</h1>
<span class="sp"></span>
<button class="btn" id="theme">深淺色</button>
<button class="btn" id="exportBtn">匯出備份</button>
<button class="btn" id="importBtn">匯入備份</button>
<input type="file" id="importFile" accept=".json" style="display:none">
<input type="month" id="mon" style="width:auto">
</header>
<div class="card">
<div class="statgrid">
<div class="stat"><b class="pos" id="sIn">0</b><span class="muted">本月總收入</span></div>
<div class="stat"><b class="neg" id="sOut">0</b><span class="muted">本月總支出</span></div>
<div class="stat"><b id="sNet">0</b><span class="muted">淨利潤</span></div>
<div class="stat"><b id="sToday">0</b><span class="muted">今日淨額</span></div>
</div>
</div>
<div class="card">
<h2>記一筆</h2>
<div class="rowline">
<div><label>日期</label><input type="date" id="f_date"></div>
<div><label>類型</label><select id="f_type"><option value="in">收入</option><option value="out">支出</option></select></div>
<div style="flex:1;min-width:150px"><label>項目</label><input id="f_item" placeholder="例：冷氣保養費／加油" style="width:100%"></div>
<div><label>金額</label><input type="number" id="f_amt" min="0" style="width:110px"></div>
<div><button class="btn primary" id="add">記帳</button></div>
</div>
</div>
<div class="card">
<h2>本月明細 <span class="muted" id="monLabel"></span></h2>
<table>
<thead><tr><th>日期</th><th>類型</th><th>項目</th><th class="num">金額</th><th></th></tr></thead>
<tbody id="body"></tbody>
</table>
</div>
<p class="muted">試用版不保存資料，重整即清空（可先用「匯出備份」把這次的內容存成檔案帶走）。全程在您的瀏覽器內運作，不經過任何伺服器。正式版資料永久保存於您的電腦。與進銷存分開記——這本帳管的是「今天到底有沒有賺錢」。</p>
</div>

</body>
</html>
