<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進銷存管理</title>
<style>
:root{color-scheme:light;--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;
--muted:#898781;--grid:#e1e0d9;--line:#c3c2b7;--border:rgba(11,11,11,.10);
--accent:#2a78d6;--accent-soft:#eef3fb;--good:#0ca30c;--good-bg:#e8f6e8;
--warn:#fab219;--warn-bg:#fdf3e0;--warn-text:#8a5b00;--crit:#d03b3b;--crit-bg:#fbeaea;--crit-text:#a32e2e;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;
--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;
--line:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1f2a3a;
--good-bg:#14290f;--warn-bg:#33270e;--warn-text:#e0a93f;--crit-bg:#351b1b;--crit-text:#e66767;}}
:root[data-theme=dark]{color-scheme:dark;--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--line:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;
--accent-soft:#1f2a3a;--good-bg:#14290f;--warn-bg:#33270e;--warn-text:#e0a93f;--crit-bg:#351b1b;--crit-text:#e66767;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:1000px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:1.3rem;font-weight:700}header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);
color:var(--ink);padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}.btn.danger{color:var(--crit)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);
border-radius:10px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--ink2);font-size:.85rem;
padding:6px 16px;border-radius:7px;cursor:pointer}
.tabs button.active{background:var(--accent);color:#fff;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.tile .label{font-size:.76rem;color:var(--muted)}
.tile .value{font-size:1.5rem;font-weight:700}
.tile .sub{font-size:.74rem;color:var(--ink2)}
.tile.warn{border-color:var(--warn)}.tile.warn .value{color:var(--warn-text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px}
input,select{width:100%;font:inherit;font-size:.88rem;color:var(--ink);background:var(--page);
border:1px solid var(--line);border-radius:8px;padding:6px 9px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:.74rem;font-weight:600;border-bottom:1px solid var(--line)}
.num{font-variant-numeric:tabular-nums}
.pane{display:none}.pane.on{display:block}
.flag{border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:600}
.flag.low{background:var(--warn-bg);color:var(--warn-text)}
.flag.zero{background:var(--crit-bg);color:var(--crit-text)}
.flag.ok{background:var(--good-bg);color:var(--good)}
.msg{font-size:.82rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none}
.msg.show{display:block}.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.err{background:var(--crit-bg);color:var(--crit-text)}
.bars{display:grid;grid-template-columns:max-content 1fr max-content;gap:4px 10px;align-items:center}
.bars .nm{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.bars .track{height:16px;background:transparent;border-left:1px solid var(--line);position:relative}
.bars .bar{position:absolute;left:0;top:2px;bottom:2px;background:var(--accent);border-radius:0 4px 4px 0}
.bars .v{font-size:.78rem;color:var(--ink2)}
.table-scroll{overflow-x:auto}
.muted{color:var(--muted);font-size:.82rem}
.tabs .del{color:var(--crit)}
</style>
</head>
<body><div style="background:#fff3cd;color:#664d03;font-size:13px;line-height:1.5;text-align:center;padding:8px 14px;border-bottom:1px solid #f0ad4e;font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif">🧪 試用版：資料僅暫存於本次瀏覽，重新整理頁面即清空，不會保存在您的裝置上。正式交付版本可為您永久保存資料。</div>
<div class="wrap">
<header>
<h1>進銷存管理</h1><span class="sp"></span>
<button class="btn" id="theme">深淺色</button>
<button class="btn" id="demo">載入示範資料</button>
<button class="btn danger" id="reset">清空全部</button>
</header>
<div class="tiles" id="tiles"></div>
<div class="tabs">
<button data-p="stock" class="active">庫存總覽</button>
<button data-p="in">進貨</button>
<button data-p="out">銷貨</button>
<button data-p="products">商品主檔</button>
<button data-p="report">分析報表</button>
</div>
<div class="pane on" id="p-stock">
<div class="card">
<h2>庫存總覽</h2>
<div class="table-scroll"><table>
<thead><tr><th>商品</th><th>分類</th><th>成本</th><th>售價</th><th>目前庫存</th><th>安全量</th><th>狀態</th><th>庫存市值</th></tr></thead>
<tbody id="stockBody"></tbody>
</table></div>
</div>
</div>
<div class="pane" id="p-in">
<div class="card">
<h2>登記進貨</h2>
<div id="inMsg" class="msg"></div>
<div class="row">
<div><label>商品</label><select id="in_prod"></select></div>
<div><label>數量</label><input id="in_qty" type="number" min="1" value="1"></div>
<div><label>進貨單價</label><input id="in_price" type="number" min="0" value="0"></div>
<div><label>日期</label><input id="in_date" type="date"></div>
<div><button class="btn primary" id="in_add">登記進貨</button></div>
</div>
</div>
<div class="card"><h2>近期進貨</h2>
<div class="table-scroll"><table><thead><tr><th>日期</th><th>商品</th><th>數量</th><th>單價</th><th>金額</th><th></th></tr></thead>
<tbody id="inBody"></tbody></table></div>
</div>
</div>
<div class="pane" id="p-out">
<div class="card">
<h2>登記銷貨</h2>
<div id="outMsg" class="msg"></div>
<div class="row">
<div><label>商品</label><select id="out_prod"></select></div>
<div><label>數量</label><input id="out_qty" type="number" min="1" value="1"></div>
<div><label>售價</label><input id="out_price" type="number" min="0" value="0"></div>
<div><label>日期</label><input id="out_date" type="date"></div>
<div><button class="btn primary" id="out_add">登記銷貨</button></div>
</div>
<div class="muted" id="out_hint"></div>
</div>
<div class="card"><h2>近期銷貨</h2>
<div class="table-scroll"><table><thead><tr><th>日期</th><th>商品</th><th>數量</th><th>售價</th><th>毛利</th><th></th></tr></thead>
<tbody id="outBody"></tbody></table></div>
</div>
</div>
<div class="pane" id="p-products">
<div class="card">
<h2>新增／編輯商品</h2>
<div id="prodMsg" class="msg"></div>
<div class="row">
<div><label>品名</label><input id="pr_name"></div>
<div><label>分類</label><input id="pr_cat" placeholder="選填"></div>
<div><label>成本</label><input id="pr_cost" type="number" min="0" value="0"></div>
<div><label>售價</label><input id="pr_price" type="number" min="0" value="0"></div>
<div><label>安全庫存</label><input id="pr_safe" type="number" min="0" value="0"></div>
<div><label>期初庫存</label><input id="pr_init" type="number" min="0" value="0"></div>
<div><button class="btn primary" id="pr_add">儲存商品</button></div>
</div>
</div>
<div class="card"><h2>商品清單</h2>
<div class="table-scroll"><table><thead><tr><th>品名</th><th>分類</th><th>成本</th><th>售價</th><th>安全庫存</th><th></th></tr></thead>
<tbody id="prodBody"></tbody></table></div>
</div>
</div>
<div class="pane" id="p-report">
<div class="card"><h2>暢銷排行（銷量 Top）</h2><div class="bars" id="topBars"></div></div>
<div class="card"><h2>滯銷提醒（有庫存但近 30 天無銷貨）</h2><div id="slowList" class="muted"></div></div>
<div class="card"><h2>毛利彙總</h2>
<div class="table-scroll"><table><thead><tr><th>商品</th><th>累計銷量</th><th>銷售額</th><th>毛利</th></tr></thead>
<tbody id="marginBody"></tbody></table></div>
</div>
</div>
</div>
