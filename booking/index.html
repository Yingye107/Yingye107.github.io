<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預約排班管理</title>
<style>
:root{color-scheme:light;--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;
--muted:#898781;--grid:#e1e0d9;--line:#c3c2b7;--border:rgba(11,11,11,.10);
--accent:#2a78d6;--accent-soft:#eef3fb;--good:#0ca30c;--good-bg:#e8f6e8;
--warn-bg:#fdf3e0;--warn-text:#8a5b00;--crit:#d03b3b;--crit-bg:#fbeaea;--crit-text:#a32e2e;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;
--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--grid:#2c2c2a;--line:#383835;
--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1f2a3a;--good-bg:#14290f;
--warn-bg:#33270e;--warn-text:#e0a93f;--crit-bg:#351b1b;--crit-text:#e66767;}}
:root[data-theme=dark]{color-scheme:dark;--surface:#1a1a19;--page:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;
--grid:#2c2c2a;--line:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1f2a3a;
--good-bg:#14290f;--warn-bg:#33270e;--warn-text:#e0a93f;--crit-bg:#351b1b;--crit-text:#e66767;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
background:var(--page);color:var(--ink);line-height:1.5;padding:20px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:1.3rem;font-weight:700}header .sp{flex:1}
.btn{font-size:.85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);
color:var(--ink);padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:.78rem}.btn.danger{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:3px}
input,select{width:100%;font:inherit;font-size:.88rem;color:var(--ink);background:var(--page);
border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.msg{font-size:.82rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none}
.msg.show{display:block}.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.err{background:var(--crit-bg);color:var(--crit-text)}
.daybar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.appt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);
border-radius:10px;margin-bottom:8px;background:var(--page)}
.appt .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;min-width:110px}
.appt .info{flex:1;font-size:.88rem}
.appt .info .sub{font-size:.78rem;color:var(--muted)}
.appt.done{opacity:.6}.appt.cancel{opacity:.5;text-decoration:line-through}
.st{border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:600}
.st.book{background:var(--accent-soft);color:var(--accent)}
.st.done{background:var(--good-bg);color:var(--good)}
.st.cancel{background:var(--crit-bg);color:var(--crit-text)}
.svc-item{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink2);
border-radius:999px;padding:3px 10px;font-size:.78rem;margin:2px}
.muted{color:var(--muted);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--page);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.tile .l{font-size:.74rem;color:var(--muted)}.tile .v{font-size:1.2rem;font-weight:700}
</style>
</head>
<body><div style="background:#fff3cd;color:#664d03;font-size:13px;line-height:1.5;text-align:center;padding:8px 14px;border-bottom:1px solid #f0ad4e;font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif">🧪 試用版：資料僅暫存於本次瀏覽，重新整理頁面即清空，不會保存在您的裝置上。正式交付版本可為您永久保存資料。</div>
<div class="wrap">
<header>
<h1>預約排班管理</h1><span class="sp"></span>
<button class="btn" id="theme">深淺色</button>
<button class="btn" id="demo">示範資料</button>

<div class="card">
<h2>服務項目</h2>
<div id="svcMsg" class="msg"></div>
<div id="svcList" style="margin-bottom:10px"></div>

<div><button class="btn primary" id="sv_add">新增服務</button></div>
</div>
</div>
<div class="card">
<h2>新增預約</h2>
<div id="apMsg" class="msg"></div>
<div class="row">
<div><label>客戶姓名</label><input id="ap_name"></div>
<div><label>電話</label><input id="ap_phone"></div>
<div><label>服務</label><select id="ap_svc"></select></div>
<div><label>日期</label><input id="ap_date" type="date"></div>
<div><label>開始時間</label><input id="ap_time" type="time"></div>
<div><button class="btn primary" id="ap_add">建立預約</button></div>
</div>
<div class="muted" id="ap_hint" style="margin-top:8px"></div>
</div>
<div class="card">
<h2>當日班表</h2>
<div class="daybar">
<button class="btn sm" id="prevDay">◀ 前一天</button>
<input id="viewDate" type="date" style="max-width:160px">
<button class="btn sm" id="nextDay">後一天 ▶</button>
<button class="btn sm" id="todayBtn">今天</button>
</div>
<div class="tiles" id="dayTiles"></div>
<div id="dayList"></div>
</div>
</div>
